<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%" role="img" aria-label="Cloud Computing Architecture Illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="640" height="420" rx="24" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="624" height="404" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Decorative Grid Dots -->
  <g fill="#334155" opacity="0.7">
    <circle cx="50" cy="50" r="2.5" /><circle cx="90" cy="50" r="2.5" /><circle cx="130" cy="50" r="2.5" />
    <circle cx="50" cy="90" r="2.5" /><circle cx="90" cy="90" r="2.5" /><circle cx="130" cy="90" r="2.5" />
    <circle cx="510" cy="50" r="2.5" /><circle cx="550" cy="50" r="2.5" /><circle cx="590" cy="50" r="2.5" />
    <circle cx="510" cy="90" r="2.5" /><circle cx="550" cy="90" r="2.5" /><circle cx="590" cy="90" r="2.5" />
  </g>

  <!-- Connection Lines from Cloud to Service Models -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.85">
    <path d="M 240 205 L 130 295" />
    <path d="M 320 215 L 320 295" />
    <path d="M 400 205 L 510 295" />
  </g>

  <!-- Data Nodes on Lines -->
  <circle cx="185" cy="250" r="5" fill="#38bdf8" />
  <circle cx="320" cy="255" r="5" fill="#818cf8" />
  <circle cx="455" cy="250" r="5" fill="#34d399" />

  <!-- Main Cloud Shape -->
  <g filter="url(#glow)">
    <path d="M 225 210
             C 185 210, 160 185, 165 150
             C 170 120, 198 102, 228 106
             C 245 70, 285 52, 328 58
             C 372 64, 405 95, 410 132
             C 442 134, 468 158, 465 186
             C 462 202, 445 210, 420 210 Z"
          fill="url(#cloudGrad)" />
  </g>

  <!-- HTTPS Lock & Cloud Label Inside Cloud -->
  <rect x="255" y="118" width="130" height="36" rx="18" fill="#0f172a" opacity="0.85" />
  <circle cx="277" cy="136" r="8" fill="#34d399" />
  <path d="M 274 136 L 276.5 138.5 L 281 133.5" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <text x="332" y="141" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">HTTPS CLOUD</text>

  <text x="320" y="182" fill="#e0f2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Global Edge CDN • Static Hosting</text>

  <!-- Bottom Tier Cards: IaaS, PaaS, SaaS -->
  <!-- IaaS Card -->
  <g transform="translate(45, 295)">
    <rect width="170" height="86" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="16" y="14" width="44" height="22" rx="6" fill="#0284c7" />
    <text x="38" y="29" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">IaaS</text>
    <text x="16" y="54" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600">Virtual Infrastructure</text>
    <text x="16" y="72" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">AWS EC2 • VPC • Storage</text>
  </g>

  <!-- PaaS Card -->
  <g transform="translate(235, 295)">
    <rect width="170" height="86" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="2" />
    <rect x="16" y="14" width="44" height="22" rx="6" fill="#4f46e5" />
    <text x="38" y="29" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PaaS</text>
    <text x="16" y="54" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600">Managed Platform</text>
    <text x="16" y="72" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">GitHub Pages • App Engine</text>
  </g>

  <!-- SaaS Card -->
  <g transform="translate(425, 295)">
    <rect width="170" height="86" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" />
    <rect x="16" y="14" width="44" height="22" rx="6" fill="#059669" />
    <text x="38" y="29" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SaaS</text>
    <text x="16" y="54" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600">Cloud Applications</text>
    <text x="16" y="72" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Google Workspace • M365</text>
  </g>
</svg>
